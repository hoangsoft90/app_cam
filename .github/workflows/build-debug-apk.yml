# Build the Cám Việt (mobile/) debug APK on GitHub Actions.
#
# Policy (owner decision 2026-09-18): NO local Android builds on the dev sandbox —
# all APK builds happen here. Debug-signed (AGP auto debug keystore, NO keystore
# secret), NO EAS token: gradle is invoked DIRECTLY (./gradlew assembleDebug)
# after the Flutter toolchain prepares the workspace.
#
# Trigger: push to main, or manual dispatch. Artifact kept 14 days.

name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # gradle-direct build: the Flutter gradle plugin needs to know the SDK
      # location (local.properties is machine-specific and never committed).
      - name: Write local.properties
        run: echo "flutter.sdk=$(dirname "$(dirname "$(which flutter)")")" > android/local.properties

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # THE build step — gradle directly, no flutter build, no EAS token.
      - name: Assemble debug APK (gradlew assembleDebug)
        run: ./gradlew assembleDebug --no-daemon

      # The Flutter gradle template redirects the android build dir to <app>/build,
      # so the APK lands at mobile/build/...; keep the classic path as fallback.
      - uses: actions/upload-artifact@v4
        with:
          name: camviet-debug-apk
          path: |
            mobile/build/app/outputs/apk/debug/app-debug.apk
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
